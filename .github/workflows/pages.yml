# Publishes the game/ folder to GitHub Pages on every push to the working branch.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy game to GitHub Pages

on:
  push:
    branches: [claude/upbeat-ritchie-oh5i49]
    paths: ['game/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
