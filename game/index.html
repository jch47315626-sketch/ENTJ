<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>삼한난세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Nanum+Brush+Script&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="field" aria-label="전장"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-vitals">
        <div class="bar hp"><i id="hpFill"></i><span id="hpText">120 / 120</span></div>
        <span id="loot" class="hud-pill loot" title="이번 판에서 번 냥 (승리하면 보너스 추가)">🪙 +0</span>
      </div>
      <div class="hud-center">
        <div id="timer" class="timer">00:00</div>
        <div id="timerSub" class="timer-sub"></div>
        <div id="bossBar" class="boss-bar" hidden>
          <div id="bossName" class="boss-name"></div>
          <div class="bar boss"><i id="bossFill"></i></div>
        </div>
      </div>
      <div class="hud-right">
        <button id="muteBtn" class="icon-btn" type="button" aria-pressed="false" aria-label="소리">🔊</button>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="일시정지">⏸</button>
      </div>
    </div>
    <div class="hud-bottom">
      <div id="evoHint" class="evo-hint" hidden></div>
      <div id="heroStatus" class="hero-status"></div>
      <div id="orderBar" class="bar order" hidden><i id="orderFill"></i><span id="orderLabel">🏯 군령</span></div>
      <div class="bar xp"><i id="xpFill"></i><span id="xpText">공훈 · Lv 1</span></div>
      <div class="bar mom"><i id="momFill"></i><span id="momLabel">기세</span></div>
    </div>
  </div>

  <div id="bossIntro" class="boss-intro" hidden aria-live="assertive">
    <p class="bi-warn">⚠️ 적장 출현!</p>
    <div class="bi-line"></div>
    <div id="biName" class="bi-name"></div>
    <div id="biEpithet" class="bi-epithet"></div>
    <div class="bi-line"></div>
  </div>

  <div id="banner" class="banner" aria-live="polite"></div>

  <section id="home" class="screen menu-screen home-screen">
    <div class="menu-wrap">
      <div class="topbar">
        <span class="coin-pill">🪙 <b id="homeMoney">0</b></span>
        <span class="topbar-right">
          <button id="homeSave" class="plain-btn small save-btn" type="button" title="기록을 코드로 저장하거나 불러오기">💾 저장</button>
          <label class="mini-toggle"><input id="soundOn" type="checkbox" checked> 🔊</label>
        </span>
      </div>
      <h1 class="game-title home-title"><span class="hanja">三韓亂世</span><span class="hangul">삼한난세</span></h1>
      <div id="homeBody"></div>
      <label class="quick"><input id="quickMode" type="checkbox"> 빠른 시험 모드 (1분 뒤 보스)</label>
    </div>
  </section>

  <section id="heroes" class="screen menu-screen" hidden><div class="menu-wrap" id="heroesBody"></div></section>
  <section id="grow" class="screen menu-screen" hidden><div class="menu-wrap" id="growBody"></div></section>
  <section id="map" class="screen menu-screen" hidden><div class="menu-wrap" id="mapBody"></div></section>
  <section id="prep" class="screen menu-screen" hidden><div class="menu-wrap" id="prepBody"></div></section>
  <section id="codex" class="screen menu-screen" hidden><div class="menu-wrap" id="codexBody"></div></section>

  <nav id="bottomNav" class="bottom-nav" aria-label="메뉴">
    <button type="button" data-go="heroes"><span>👑</span><b>영웅</b></button>
    <button type="button" data-go="grow"><span>📈</span><b>성장</b></button>
    <button type="button" data-go="map"><span>🗺️</span><b>전장</b></button>
    <button type="button" data-go="codex"><span>📖</span><b>도감</b></button>
  </nav>
  <p id="toast" class="toast" role="status" hidden></p>

  <section id="intro" class="screen intro-screen" hidden>
    <p id="introYear" class="intro-year"></p>
    <h2 id="introName" class="intro-name"></h2>
    <p id="introText" class="intro-text"></p>
  </section>

  <section id="levelup" class="screen dim" hidden>
    <h2 class="panel-title">책략 선택</h2>
    <div id="choices" class="choices"></div>
    <p class="hint">눌러서 고르거나 1 · 2 · 3 키</p>
  </section>

  <section id="pause" class="screen dim" hidden>
    <h2 class="panel-title">잠시 멈춤</h2>
    <div id="pauseOwned" class="owned pause-owned"></div>
    <div class="row-btns">
      <button id="resumeBtn" class="seal-btn" type="button">계속</button>
      <button id="quitBtn" class="plain-btn" type="button">처음으로</button>
    </div>
  </section>

  <section id="result" class="screen dim" hidden>
    <div class="result-card">
      <div id="resultSeal" class="big-seal">平定</div>
      <h2 id="resultTitle" class="panel-title"></h2>
      <div id="resultStars" class="result-stars"></div>
      <p id="resultText" class="result-text"></p>
      <ul id="resultRows" class="result-rows"></ul>
      <div class="row-btns">
        <button id="nextBtn" class="seal-btn" type="button" hidden>다음 전장</button>
        <button id="retryBtn" class="seal-btn" type="button">다시 출진</button>
      </div>
      <div class="row-btns">
        <button id="toMapBtn" class="plain-btn" type="button">🗺️ 전장으로</button>
        <button id="homeBtn" class="plain-btn" type="button">🏠 홈</button>
      </div>
    </div>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
